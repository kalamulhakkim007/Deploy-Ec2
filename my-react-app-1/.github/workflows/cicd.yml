name: CICD

on:
  push:
  branches: 
    - main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.PASSWORD }}
      - name: Build Docker Image
        run: docker build -t kalamulhakkim007/Deploy-Ec2 .
      - name: Publish image to Docker Hub
        run: docker push kalamulhakkim007/Deploy-Ec2:latest


  deploy:
    needs: build
    runs-on: aws-ec2       
    steps: 
      - name: Pull image from docker hub
        run: docker pull kalamulhakkim007/Deploy-Ec2:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run docker container    
        run: docker run -d -p 3000:80 --name reactContainer  kalamulhakkim007/Deploy-Ec2